name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/npm-shrinkwrap.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          CI: false

  deploy:
    name: Deploy to Render
    needs: [backend-typecheck, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deploy
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_BACKEND_DEPLOY_HOOK secret is not set!"
            exit 1
          fi
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo " Backend deploy triggered"

      - name: Trigger Frontend Deploy
        run: |
          if [ -z "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_FRONTEND_DEPLOY_HOOK secret is not set!"
            exit 1
          fi
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo " Frontend deploy triggered"

      - name: Build frontend
        run: npm run build

  phase4-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run migrations (if secrets are configured)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run migrate

      - name: Run phase4 validation (if secrets are configured)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run validate:phase4

      - name: Skip note when DATABASE_URL missing
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "Skipping phase4 validation because DATABASE_URL secret is not configured."

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend-typecheck, frontend-build, phase4-regression]
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger backend deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [backend-typecheck, frontend-build, phase4-regression]
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger frontend deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
